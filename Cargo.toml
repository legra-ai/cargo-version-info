[package]
name = "cargo-version-info"
description = "Cargo subcommand for unified version management across CI/CD, Rust code, and shell scripts"
version = "0.0.20"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "version", "semver", "cli", "ci"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
authors = ["Jacobus Geluk <jacobus@dataroad.com>"]
repository = "https://github.com/legra-ai/cargo-version-info"
documentation = "https://docs.rs/cargo-version-info"
homepage = "https://github.com/legra-ai/cargo-version-info"
rust-version = "1.94.1"
publish = true

exclude = [
    ".cargo/",
    ".cargo-husky/",
    ".clippy.toml",
    ".cursor/",
    ".github/",
    ".gitignore",
    ".rust-toolchain.toml",
    ".vscode/",
    "cog.toml",
    "rustfmt.toml",
    "scripts/",
]

[[bin]]
name = "cargo-version-info"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bstr = "1.13.1"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", default-features = false, features = [
    "derive",
    "env",
    "std",
] }
dotenvage = "0.7.3"
gix = { version = "0.86.0", default-features = false, features = [
    "revision",
    "worktree-mutation",
    "index",
    "blob-diff",
    "sha1",
] }
octocrab = { version = "0.54.1", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "timeout",
    "tracing",
    "futures-util",
    "hyper-rustls",
    "hyper-timeout",
    "tokio",
    "jwt-aws-lc-rs",
] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "fs",
    "process",
] }
toml = "1.1"
toml_edit = "0.25.13"
carlog = "0.1"
console = "0.16.4"
indicatif = "0.18.6"
cargo-plugin-utils = "0.0.12"
portable-pty = "0.9.0"
smallvec = "1.15.2"
tempfile = "3.27.0"
similar = { version = "3.1.2", features = ["text"] }

# SSH commit signing
ssh-key = { version = "0.6", features = ["ed25519", "p256", "p384", "rsa"] }
ssh-agent-client-rs = "1.1"

[build-dependencies]
anyhow = "1.0.104"
gix = { version = "0.86.0", default-features = false, features = [
    "revision",
    "worktree-mutation",
    "index",
    "blob-diff",
    "sha1",
] }
toml = "1.1"
rhusky = "0.0.6"

[dev-dependencies]
tempfile = "3.27"
serial_test = "3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
