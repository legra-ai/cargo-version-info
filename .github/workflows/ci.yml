name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@2ff75bbc66cc08064a55b97dd693ef60f4d9b95d
    with:
      crate-name: cargo-version-info
      kind: binary
    secrets: inherit
