name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@ce9df3b84458b7a2f0c771fad3a8bf725fbef47d
    with:
      crate-name: cargo-version-info
      kind: binary
    secrets: inherit
