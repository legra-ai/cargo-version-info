name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@0bead4673cfb56ba38b46fa3661b053572c425f6
    with:
      crate-name: cargo-version-info
      kind: binary
    secrets: inherit
