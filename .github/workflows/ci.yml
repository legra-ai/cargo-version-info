name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  ci:
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@543e2ff4cca5ffab12bff13411a3cdaa3f25416f
    with:
      crate-name: cargo-version-info
      kind: binary
    secrets: inherit
