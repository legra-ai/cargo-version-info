name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  ci:
    needs: prepare
    uses: legra-ai/github-actions/.github/workflows/cargo-maintenance.yml@0d8d26076087886d4741bafd9c34d4066df34075
    with:
      crate-name: cargo-version-info
      kind: binary
    secrets: inherit
  test:
    if: always()
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete shared pipeline
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          python3 - <<'PYTHON'
          import os
          if any(os.environ[name] != 'success' for name in ['PREPARE_RESULT', 'CI_RESULT']):
              raise RuntimeError('Every required maintenance job must succeed')
          PYTHON
