name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-24.04
    steps:
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@543e2ff4cca5ffab12bff13411a3cdaa3f25416f
