name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-24.04
    steps:
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@ade19d2cab57447f2450b1d5339b3e8143fe4510
