name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-24.04
    steps:
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@49efdb43fdabe6f5be5ac9bac23e126e4f5aca97
