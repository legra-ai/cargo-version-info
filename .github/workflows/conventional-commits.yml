name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-24.04
    steps:
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@03689aa49b2c6f7ab5872a37c2613c50482c8649
