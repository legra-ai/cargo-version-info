name: Merge tested dependencies
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: merger
        with:
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_MERGER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/merge-tested-dependabot@29a776a46cbaf52a403f6f347d994bc9bd17c1f9
        with:
          token: ${{ steps.merger.outputs.token }}
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
