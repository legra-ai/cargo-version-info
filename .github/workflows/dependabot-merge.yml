name: Merge tested dependencies
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: merger
        with:
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_MERGER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/merge-tested-dependabot@fbe4d05b41aaff86a7a38bd0228943d8cfead4e1
        with:
          token: ${{ steps.merger.outputs.token }}
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
